services:
  # CLI: client dell'API dell'agente (python -m assistente).
  assistente:
    build: .
    environment:
      AGENTE_URL: http://agente:8100
    depends_on:
      - agente
    stdin_open: true
    tty: true

  # Agente come servizio HTTP (python -m assistente.servizio): grafo, client MCP e strumenti.
  # Nessuna porta pubblicata: lo raggiungono solo gli altri container.
  agente:
    build: .
    command: ["python", "-m", "assistente.servizio"]
    env_file: .env
    environment:
      LMSTUDIO_BASE_URL: http://host.docker.internal:1234/v1
      SCADENZE_API_URL: http://scadenze:8000
      PERCORSO_DB_NOTE: /app/note/note.sqlite3
      AGENTE_HOST: 0.0.0.0
      AGENTE_PORTA: "8100"
    volumes:
      # Le note restano anche quando il container viene ricreato; `docker compose down -v` le cancella.
      - note:/app/note
      # Preferenze dell'utente (resource MCP): modificabili sull'host, valgono dalla sessione successiva.
      - ./preferenze.json:/app/preferenze.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - scadenze

  scadenze:
    build: .
    command: ["python", "-m", "scadenze_api"]
    environment:
      SCADENZE_API_HOST: 0.0.0.0
      SCADENZE_API_PORTA: "8000"

volumes:
  note:
